<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sleep Outside | Checkout</title>

  <link rel="stylesheet" href="../css/style.css" />

  <script type="module" href="../js/checkout.js"></script>

</head>

<body>

  <header class="divider" id="main-header"></header>

  <main class="divider checkout">

    <h2>Review & Place your Order</h2>

    <section class="checkout-form">

      <form id="checkout-form" name="checkout">

        <fieldset>
          <legend>Customer Information</legend>

          <div class="checkout__name">

            <label for="fname">First Name</label>
            <input
              type="text"
              id="fname"
              name="fname"
              required
            />

            <label for="lname">Last Name</label>
            <input
              type="text"
              id="lname"
              name="lname"
              required
            />

          </div>

          <div class="checkout__address">

            <label for="street">Street Address</label>
            <input
              type="text"
              id="street"
              name="street"
              required
            />

            <label for="city">City</label>
            <input
              type="text"
              id="city"
              name="city"
              required
            />

            <label for="state">State</label>
            <input
              type="text"
              id="state"
              name="state"
              required
            />

            <label for="zip">Zip Code</label>
            <input
              type="text"
              id="zip"
              name="zip"
              required
            />

          </div>
        </fieldset>

        <fieldset>

          <legend>Payment</legend>

          <div class="checkout__payment">

            <label for="cardNumber">Card Number</label>
            <input
              type="text"
              id="cardNumber"
              name="cardNumber"
              required
            />

            <label for="expiration">Expiration Date</label>
            <input
              type="text"
              id="expiration"
              name="expiration"
              placeholder="MM/YY"
              required
            />

            <label for="code">Security Code</label>
            <input
              type="text"
              id="code"
              name="code"
              required
            />

          </div>

        </fieldset>

        <fieldset class="checkout-summary">

          <legend>Order Summary</legend>

          <div class="order-summary">

            <div>Items</div>
            <div id="itemCount">0</div>

            <div>Subtotal</div>
            <div id="subtotal">$0.00</div>

            <div>Shipping</div>
            <div id="shipping">$0.00</div>

            <div>Tax</div>
            <div id="tax">$0.00</div>

            <div><strong>Total</strong></div>
            <div id="orderTotal"><strong>$0.00</strong></div>

          </div>

        </fieldset>

        <button id="checkoutSubmit" type="submit">
          Checkout
        </button>

      </form>

    </section>

  </main>

  <footer id="main-footer"></footer>

</body>

</html>
